name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch and Prepare Data
        run: |
          mkdir -p data
          # Chạy script tải dữ liệu mặc định của repo nếu có
          python -m open_fpl_solver.get_data || python dev/get_data.py || true
          
          # Tải dữ liệu FPL Review chuẩn về lưu thành cả 2 tên file để chống mọi lỗi thiếu file
          curl -s -L "https://raw.githubusercontent.com/fploptimiser/fplreview-data/main/fplreview.csv" -o data/fplreview.csv || true
          cp data/fplreview.csv data/solio.csv || true

      - name: Run Optimization
        run: |
          SOLVE_PATH=$(find . -name "solve.py" | head -n 1)
          PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json --datasource fplreview || PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json
