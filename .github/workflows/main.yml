name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare Data Folder
        run: |
          mkdir -p data
          # Nếu chưa có solio.csv, tải dữ liệu từ fplreview hoặc tạo file data trống
          if [ ! -f "data/solio.csv" ]; then
            python -c "import pandas as pd; pd.DataFrame().to_csv('data/solio.csv')" || true
          fi

      - name: Run Optimization
        run: |
          SOLVE_PATH=$(find . -name "solve.py" | head -n 1)
          PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json --datasource fplreview || PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json
