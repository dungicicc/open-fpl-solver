name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Optimization
        run: |
          if command -v fpl-cli &> /dev/null; then
            fpl-cli solve --settings data/user_settings.json
          elif command -v fpl-solver &> /dev/null; then
            fpl-solver solve --settings data/user_settings.json
          elif command -v open-fpl-solver &> /dev/null; then
            open-fpl-solver solve --settings data/user_settings.json
          else
            python -m src.open_fpl_solver.cli solve --settings data/user_settings.json || python -m open_fpl_solver.cli solve --settings data/user_settings.json
          fi
