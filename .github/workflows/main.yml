name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install requests pandas

      - name: Fetch Official FPL Data & Build Projection Files
        run: |
          mkdir -p data
          python -c "
          import urllib.request, json, pandas as pd

          # 1. Tải dữ liệu từ FPL Official API
          url = 'https://fantasy.premierleague.com/api/bootstrap-static/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read().decode('utf-8'))

          elements = pd.DataFrame(data['elements'])
          element_types = {1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD'}
          teams = {t['id']: t['short_name'] for t in data['teams']}

          # 2. Xây dựng cấu trúc chuẩn dữ liệu cầu thủ
          df = pd.DataFrame()
          df['ID'] = elements['id']
          df['id'] = elements['id']
          df['Name'] = elements['web_name']
          df['name'] = elements['web_name']
          df['Pos'] = elements['element_type'].map(element_types)
          df['Team'] = elements['team'].map(teams)
          df['Price'] = elements['now_cost'] / 10.0
          df['BV'] = df['Price']
          df['SV'] = df['Price']
          
          # Tính xP cơ bản từ form/ep_next
          xp_val = elements['ep_next'].astype(float)
          df['xP'] = xp_val
          df['Pts'] = xp_val

          # Tạo đầy đủ các định dạng cột theo Gameweek (1 -> 38)
          for gw in range(1, 39):
              df[f'BV_{gw}'] = df['Price']
              df[f'SV_{gw}'] = df['Price']
              df[f'{gw}_BV'] = df['Price']
              df[f'{gw}_SV'] = df['Price']
              
              df[f'xP_{gw}'] = xp_val
              df[f'Pts_{gw}'] = xp_val
              df[f'{gw}_xP'] = xp_val
              df[f'{gw}_Pts'] = xp_val

          # 3. Ghi file ra thư mục data
          df.to_csv('data/solio.csv', index=False)
          df.to_csv('data/fplreview.csv', index=False)
          print('--> Generating datasets with all GW prediction columns completed!')
          "

      - name: Run Optimization
        run: |
          SOLVE_PATH=$(find . -name "solve.py" | head -n 1)
          PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json
