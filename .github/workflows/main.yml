name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Optimization
        run: |
          PYTHONPATH=. python src/open_fpl_solver/solve.py --config data/user_settings.json || PYTHONPATH=. python solve.py --config data/user_settings.json || python -m open_fpl_solver.solve --config data/user_settings.json
