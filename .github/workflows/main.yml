name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Optimization
        run: |
          PYTHONPATH=. python -m $(autopep8 --version &>/dev/null; find . -maxdepth 3 -name "cli.py" -o -name "solve.py" -o -name "main.py" | head -n 1 | sed 's|^\./||;s/\.py$//;s|/|.|g') solve --settings data/user_settings.json || fplsolve --settings data/user_settings.json || openfpl --settings data/user_settings.json || python -m open_fpl_solver solve --settings data/user_settings.json
