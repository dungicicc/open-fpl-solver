name: Run FPL Optimization

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch Latest FPL Data
        run: |
          mkdir -p data
          # Tải dữ liệu dữ báo điểm / API về data/
          PYTHONPATH=. python -m src.open_fpl_solver.get_data || PYTHONPATH=. python dev/get_data.py || PYTHONPATH=. python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/fploptimiser/fplreview-data/main/fplreview.csv', 'data/fplreview.csv')" || true

      - name: Run Optimization
        run: |
          SOLVE_PATH=$(find . -name "solve.py" | head -n 1)
          PYTHONPATH=. python "$SOLVE_PATH" --config data/user_settings.json
